events {}

http {

  # Logging (outputs to log directory on the container)
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # Includes styles and scripts
  include mime.types;

  # Performance optimization
  sendfile on;

  # Enable file compression
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml;

  server {

    # Nginx port (same as in Docker file)
    listen 80;
    server_name localhost;

    # Point the root page to angular dist copied into the docker container
    root /usr/share/nginx/html/;
    ## (optionally) specify the entry point
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        font-src 'self' data:;
        connect-src 'self' https:;
        object-src 'none';
        frame-ancestors 'self';
        base-uri 'self';
    " always;

    # Cache JS scripts, styles, and fonts for 1 week
    location ~* \.(js|css|woff2)$ {
        access_log off; # no need to log these calls
        expires 1w;
        add_header Vary "Accept-Encoding";
        add_header Cache-Control "public, immutable";
    }

    # Cache images for 1 year
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        access_log off; # no need to log these calls
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Angular (SPA) Routing
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
